name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests scripts
      - name: Test
        env:
          DATABASE_URL: sqlite+pysqlite:////tmp/netmon-ci.db
          JWT_SECRET: ci-jwt-secret-value-32-chars-min
          SECRETS_MASTER_KEY: ci-master-key-32-bytes-long-key!
          BOOTSTRAP_ADMIN_EMAIL: admin@example.com
          BOOTSTRAP_ADMIN_PASSWORD: TestPass123!
          ZABBIX_ENABLED: "false"
        run: pytest -q
      - name: Export OpenAPI
        env:
          DATABASE_URL: sqlite+pysqlite:////tmp/netmon-ci.db
          JWT_SECRET: ci-jwt-secret-value-32-chars-min
          SECRETS_MASTER_KEY: ci-master-key-32-bytes-long-key!
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from app.main import app
          Path("../docs/openapi.json").write_text(
              json.dumps(app.openapi(), ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print("wrote docs/openapi.json")
          PY

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: |
          cp .env.example .env
          docker compose --env-file .env -f compose.yaml config --quiet

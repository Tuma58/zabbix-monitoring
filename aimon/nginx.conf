server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA-подобный дашборд (hash-роутинг)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Пакеты агентов Checkmk (проксируются с сайта Checkmk)
    location /agent/ {
        proxy_pass http://checkmk:5000/cmk/check_mk/agents/;
        proxy_set_header Host $host;
    }

    # Скрипты установки агентов раздаются статикой из /agents
    location /agents/ {
        try_files $uri =404;
        add_header Content-Type "text/plain; charset=utf-8";
    }
}

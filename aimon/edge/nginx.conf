# Единый edge AIMon:
#   80 / 443  — домен (dashboard + /api/ + /agents/ + /cmk/)
#   7080 / 7443 — Checkmk UI
#   7081 / 7444 — Dashboard (+ /api/, /agents/, /agent/)
#   7000 / 7445 — API

upstream aimon_checkmk {
    server checkmk:5000;
}

upstream aimon_dashboard {
    server dashboard:80;
}

upstream aimon_api {
    server api:8000;
}

# --- Domain HTTP → HTTPS redirect ---
server {
    listen 80;
    server_name aimon.coresupport.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Domain HTTPS: Dashboard + API + Checkmk path ---
server {
    listen 443 ssl;
    server_name aimon.coresupport.ru;

    ssl_certificate     /etc/nginx/certs/aimon.crt;
    ssl_certificate_key /etc/nginx/certs/aimon.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 64m;

    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 180s;
        proxy_pass http://aimon_api/api/;
    }

    location /agents/ {
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://aimon_dashboard/agents/;
    }

    location /agent/ {
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://aimon_checkmk/cmk/check_mk/agents/;
    }

    location /cmk/ {
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 300s;
        proxy_pass http://aimon_checkmk/cmk/;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_pass http://aimon_dashboard;
    }
}

# --- HTTP: Checkmk ---
server {
    listen 7080;
    server_name _;
    client_max_body_size 64m;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host              $host;

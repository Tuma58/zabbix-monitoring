# TLS edge: HTTPS по IP (самоподписанный сертификат с SAN).
# HTTP-сервисы (7080/7081/7000) остаются доступны напрямую для локального доступа.

upstream netmon_zabbix {
    server zabbix-web:8080;
}

upstream netmon_dashboard {
    server dashboard:80;
}

upstream netmon_api {
    server api:8000;
}

server {
    listen 7443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/netmon.crt;
    ssl_certificate_key /etc/nginx/certs/netmon.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 32m;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 300s;
        proxy_pass http://netmon_zabbix;
    }
}

server {
    listen 7444 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/netmon.crt;
    ssl_certificate_key /etc/nginx/certs/netmon.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 16m;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Request-ID      $request_id;
        proxy_pass http://netmon_dashboard;
    }
}

server {
    listen 7445 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/netmon.crt;
    ssl_certificate_key /etc/nginx/certs/netmon.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 16m;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Request-ID      $request_id;
        proxy_pass http://netmon_api;
    }
}

# Единый edge: HTTP (70xx) + HTTPS по IP (74xx).
# Самоподписанный сертификат с SAN (LOCAL_ACCESS_IP / публичный IP).

upstream netmon_zabbix {
    server zabbix-web:8080;
}

upstream netmon_dashboard {
    server dashboard:80;
}

upstream netmon_api {
    server api:8000;
}

# --- HTTP: Zabbix ---
server {
    listen 7080;
    server_name _;
    client_max_body_size 32m;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 300s;
        proxy_pass http://netmon_zabbix;
    }
}

# --- HTTPS: Zabbix ---
server {
    listen 7443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/netmon.crt;
    ssl_certificate_key /etc/nginx/certs/netmon.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 32m;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 300s;
        proxy_pass http://netmon_zabbix;
    }
}

# --- HTTP: Dashboard (+ /api/ proxy) ---
server {
    listen 7081;
    server_name _;
    client_max_body_size 16m;

    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Request-ID      $request_id;
        proxy_pass http://netmon_api/api/;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_pass http://netmon_dashboard;
    }
}

# --- HTTPS: Dashboard ---
server {
    listen 7444 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/netmon.crt;
    ssl_certificate_key /etc/nginx/certs/netmon.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 16m;

    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Request-ID      $request_id;
        proxy_pass http://netmon_api/api/;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Request-ID      $request_id;
        proxy_pass http://netmon_dashboard;
    }
}

